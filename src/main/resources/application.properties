# Nombre de la aplicación (aparece en logs y en el Actuator si lo usas)
spring.application.name=tareas

# --- Configuración de la base de datos MySQL ---
# URL de conexión. createDatabaseIfNotExist=true crea la BD si no existe aún
spring.datasource.url=jdbc:mysql://localhost:3306/tareas_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
# Driver JDBC de MySQL (Connector/J)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Configuración de JPA / Hibernate ---
# ddl-auto=update: Hibernate actualiza el esquema automáticamente según las entidades
# (útil en desarrollo; en producción se recomienda "validate" o usar migraciones tipo Flyway/Liquibase)
spring.jpa.hibernate.ddl-auto=update
# Muestra en consola las sentencias SQL generadas por Hibernate (útil para depurar)
spring.jpa.show-sql=true

# Indica que esta app NO es una app web tradicional (sin servidor embebido tipo Tomcat)
# Común cuando el backend se ejecuta como proceso standalone junto a un cliente JavaFX
spring.main.web-application-type=none